[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/#admin"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
